name: Gerar cobrinha de contribuicoes

on:
  # Meia-noite de Brasilia e 03h UTC. O agendamento do Actions e
  # melhor esforco, nao horario: medido neste repositorio, o atraso
  # foi de 6h15 a 6h31. Dois disparos por dia para que o desenho
  # nao fique preso no atraso de um deles.
  schedule:
    - cron: "0 3,15 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar os SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # PAT com escopo read:user, se existir; senao o token padrao.
          # O PAT so ajuda DEPOIS de ligar "Include private contributions
          # on my profile" em github.com/settings/profile -- sem isso o
          # calendario publico nao tem os dias privados para desenhar.
          github_token: ${{ secrets.PAT_CONTRIBUICOES || github.token }}
          # A paleta "github-dark" do Platane e mais escura que a do
          # GitHub de verdade (nivel 1 em #01311f contra #0e4429). As
          # cinco cores abaixo sao as do grafico original.
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#8B5CF6&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
