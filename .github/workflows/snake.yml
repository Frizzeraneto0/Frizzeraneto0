name: Gerar cobrinha de contribuicoes

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar os SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # PAT com escopo read:user, se existir; senao o token padrao.
          # O PAT so ajuda DEPOIS de ligar "Include private contributions
          # on my profile" em github.com/settings/profile -- sem isso o
          # calendario publico nao tem os dias privados para desenhar.
          github_token: ${{ secrets.PAT_CONTRIBUICOES || github.token }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
